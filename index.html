  <title>CYBER QUEST JAPAN for PHP</title>
  
  <style>/* CYBER QUEST JAPAN for PHP — ダークテーマ。可読性とコントラスト優先。色だけに頼らず、アイコン・文字も併用する。 */
:root {
  --bg: #06122b; --bg2: #0a1d42; --card: #0d2150; --card2: #122a60; --line: #24407f;
  --text: #eaf3ff; --muted: #a9bfdf; --cyan: #22d3ee; --cyan-d: #0e7490;
  --ok: #4ade80; --ok-bg: #0f3a2a; --ng: #fb7185; --ng-bg: #4a1626; --warn: #fbbf24; --warn-bg: #3d2f0b; --info-bg: #0b3550;
  --radius: 14px;
  --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: radial-gradient(1200px 600px at 80% -10%, #12306e 0%, transparent 60%), var(--bg); color: var(--text); font-family: var(--font); line-height: 1.75; font-size: 17px; }
[data-motion="reduce"] html, html[data-motion="reduce"] { scroll-behavior: auto; }
html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.main { padding-top: 20px; padding-bottom: 40px; outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -999px; top: 0; background: var(--cyan); color: #00131c; padding: 8px 14px; z-index: 100; font-weight: 700; }
.skip:focus { left: 8px; top: 8px; }
a { color: #7dd3fc; text-underline-offset: 3px; }
a:hover { color: #bae6fd; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; border-radius: 6px; }
h1 { font-size: 1.9rem; line-height: 1.35; margin: 0.3em 0 0.5em; }
h2 { font-size: 1.35rem; line-height: 1.4; margin: 1.2em 0 0.5em; }
h3 { font-size: 1.12rem; line-height: 1.45; margin: 1em 0 0.4em; }
h4 { margin: 1em 0 0.3em; }
[tabindex="-1"]:focus { outline: none; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.lead { font-size: 1.1rem; color: #d6e6ff; }
code, pre { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace; }

/* ヘッダー */
.site-header { background: rgba(6, 18, 43, 0.92); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(6px); }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 800; letter-spacing: 0.02em; }
.brand-text { font-size: 1.05rem; }
.lvchip { font-size: 0.85rem; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: #cfe6ff; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 8px; padding-top: 4px; }
.nav a { color: var(--text); text-decoration: none; padding: 5px 11px; border-radius: 8px; font-size: 0.92rem; border: 1px solid transparent; }
.nav a:hover { background: var(--card); }
.nav a[aria-current="page"] { background: var(--cyan-d); border-color: var(--cyan); }
.site-footer { color: var(--muted); font-size: 0.85rem; padding-bottom: 40px; border-top: 1px solid var(--line); margin-top: 20px; padding-top: 14px; }

/* ボタン */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; padding: 10px 18px; min-height: 44px; border-radius: 10px; border: 2px solid var(--cyan); background: var(--cyan); color: #00131c; cursor: pointer; text-decoration: none; transition: transform 0.12s, background 0.12s; }
.btn:hover { background: #67e8f9; color: #00131c; transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { background: var(--card2); border-color: var(--cyan); color: var(--text); }
.btn.danger { background: transparent; color: #fecdd3; border-color: var(--ng); }
.btn.danger:hover { background: var(--ng-bg); color: #fff; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 0.88rem; }
.btn.big { font-size: 1.1rem; padding: 14px 24px; }
.btn[disabled], .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn.primary[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--cyan); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 4px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

/* カード */
.card { background: linear-gradient(180deg, var(--card), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 14px 0; }
.cards { display: grid; gap: 10px; }
.chip { display: inline-block; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 11px; font-size: 0.82rem; margin: 2px 6px 2px 0; color: #d6e6ff; }
.chip.ok { border-color: var(--ok); color: #bbf7d0; }
.meta-row { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
.sep { border: 0; border-top: 1px dashed var(--line); margin: 22px 0; }
.warn-text { color: var(--warn); }

/* 注意書き */
.note { border-left: 5px solid var(--cyan); background: var(--info-bg); padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
.note-warn { border-color: var(--warn); background: var(--warn-bg); }
.note-fact { border-color: #a78bfa; background: #261a52; }

/* バッジ（色＋アイコン＋文字） */
.badge { display: inline-block; border-radius: 6px; padding: 0 8px; font-size: 0.78rem; font-weight: 700; border: 1px solid; white-space: nowrap; }
.badge-confirmed { color: #bbf7d0; border-color: var(--ok); background: var(--ok-bg); }
.badge-secondary { color: #fde68a; border-color: var(--warn); background: var(--warn-bg); }
.badge-unconfirmed { color: #fecdd3; border-color: var(--ng); background: var(--ng-bg); }
details.fact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
details.fact[open] { background: var(--card2); }
details.fact summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
.fact-title { margin-right: 6px; }
.fact-body { padding-bottom: 10px; }
.caveat { color: #fde68a; font-size: 0.93rem; }
.fact-src ul { padding-left: 1.2em; font-size: 0.9rem; }

/* ヒーロー */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: center; padding: 18px 0 8px; }
.hero h1 { font-size: 2.3rem; margin: 0.2em 0; }
.hero-logo { display: flex; gap: 8px; align-items: center; color: var(--cyan); font-weight: 800; letter-spacing: 0.06em; }
.hero-panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.lv-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lv-badge { background: var(--cyan); color: #00131c; font-weight: 800; border-radius: 8px; padding: 0 10px; }
.progress-total { margin: 12px 0; }
.progress-total strong { font-size: 1.6rem; margin: 0 6px; }
.bar { height: 12px; background: #0a1a3d; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 6px 0; }
.bar.small { height: 8px; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #0ea5c6, var(--cyan)); transition: width 0.5s ease; }
.bar.risk .bar-fill { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.bar.impact .bar-fill { background: linear-gradient(90deg, #6366f1, #a78bfa); }
.trial-teaser { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: linear-gradient(90deg, #0f2a63, #0a3a5a); border: 1px solid var(--cyan-d); border-radius: var(--radius); padding: 14px 20px; margin: 24px 0; }
.unconfirmed-note { border: 1px dashed var(--line); border-radius: var(--radius); padding: 4px 20px 16px; }

/* ステージカード */
.stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.stage-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.stage-card h3 { margin: 0.2em 0; }
.stage-card .btn { margin-top: auto; align-self: flex-start; }
.stage-card.cleared { border-color: var(--ok); }
.stage-card.locked { opacity: 0.8; border-style: dashed; }
.sc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sc-no { font-weight: 800; color: var(--cyan); letter-spacing: 0.06em; }
.status { font-size: 0.82rem; font-weight: 700; }
.status.ok { color: var(--ok); } .status.open { color: #7dd3fc; } .status.lock { color: var(--muted); }

/* ステージ進行 */
.stage-head h2 { margin-top: 6px; }
.stepbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stepdot { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--card); border: 2px solid var(--line); font-size: 0.8rem; font-weight: 700; }
.stepdot.done { background: var(--ok-bg); border-color: var(--ok); color: #bbf7d0; }
.stepdot.cur { border-color: var(--cyan); background: var(--cyan-d); }
.intro-badge { display: inline-block; background: var(--cyan); color: #00131c; font-weight: 800; padding: 0 14px; border-radius: 8px; letter-spacing: 0.1em; }
.prose p, .prose li { max-width: 46em; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
thead th { background: var(--card2); }
tbody th { background: #0a1a3d; font-weight: 600; }
pre.code { background: #040c1e; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; }

/* 選択肢・問題 */
fieldset { border: 0; padding: 0; margin: 10px 0; min-inline-size: 0; }
fieldset.choices legend { padding: 0; margin-bottom: 6px; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 8px 0; cursor: pointer; }
.choice:hover { border-color: var(--cyan); }
.choice input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--cyan); flex: none; }
.choice.sel { border-color: var(--cyan); background: var(--card2); }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--ng); background: var(--ng-bg); }
.choice-text { flex: 1; }
.choice-mark { font-weight: 800; white-space: nowrap; margin-left: 8px; }
.choices.inline { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.choices.inline legend { width: 100%; }
.choices.inline .choice { margin: 4px 0; }
.q-meta { margin-bottom: 4px; }
.q-prompt { font-size: 1.2rem; margin-top: 0.4em; }
.result { border-radius: 12px; padding: 12px 16px; margin: 14px 0; border: 2px solid; }
.result.ok { border-color: var(--ok); background: var(--ok-bg); }
.result.ng { border-color: var(--ng); background: var(--ng-bg); }
.result-head { font-size: 1.1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.xp-chip { background: var(--cyan); color: #00131c; border-radius: 999px; padding: 0 12px; font-weight: 800; font-size: 0.85rem; }
.related { margin-top: 6px; }
.order-list { list-style: none; padding: 0; margin: 10px 0; }
.order-item { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; margin: 8px 0; flex-wrap: wrap; }
.order-item.right { border-color: var(--ok); background: var(--ok-bg); }
.order-item.wrong { border-color: var(--ng); background: var(--ng-bg); }
.order-no { width: 28px; height: 28px; border-radius: 50%; background: var(--cyan-d); display: grid; place-items: center; font-weight: 800; flex: none; }
.order-text { flex: 1; min-width: 12em; }
.order-btns { display: flex; gap: 6px; }
.codebox { background: #040c1e; border: 1px solid var(--line); border-radius: 10px; padding: 6px; margin: 8px 0; }
.codeline { display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--text); border: 2px solid transparent; border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; min-height: 36px; }
.codeline code { white-space: pre-wrap; word-break: break-all; flex: 1; font-size: 0.92rem; }
.codeline:hover { background: var(--card); }
.codeline.sel { border-color: var(--cyan); background: var(--card2); }
.codeline.seen .ln { color: var(--ok); }
.codeline.right { border-color: var(--ok); background: var(--ok-bg); }
.codeline.wrong { border-color: var(--ng); background: var(--ng-bg); }
.ln { color: var(--muted); width: 1.8em; text-align: right; flex: none; }

/* フロー図・活動 */
.flow-nodes { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; counter-reset: n; }
.flow-node button { width: 100%; height: 100%; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; position: relative; min-height: 120px; }
.flow-node button:hover { border-color: var(--cyan); }
.flow-node.active button { border-color: var(--cyan); background: var(--card2); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.25); }
.flow-node.passed button { border-color: #2b5aa8; }
.flow-icon { font-size: 1.6rem; }
.flow-name { font-weight: 800; }
.flow-short { font-size: 0.85rem; color: var(--muted); }
.packet { font-size: 0.8rem; color: var(--warn); font-weight: 700; animation: pulse 1.4s ease-in-out infinite; }
.seen-mark { position: absolute; top: 6px; right: 10px; color: var(--ok); font-weight: 800; }
.flow-detail { background: #07173a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 10px 0; min-height: 3.4em; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.concept { background: #07173a; border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 10px; margin: 12px 0; }
.concept-steps { padding-left: 1.2em; }
.mission-count { font-weight: 800; color: var(--cyan); }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 8px 0 14px; }
.meter-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.delta { font-weight: 800; font-size: 0.85rem; }
.delta.up { color: #fca5a5; } .delta.down { color: #86efac; }
.situation { background: #07173a; border-left: 5px solid var(--cyan); padding: 10px 14px; border-radius: 8px; }
.options { display: grid; gap: 10px; margin: 12px 0; }
.option { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; min-height: 52px; }
.option:hover:not(:disabled) { border-color: var(--cyan); }
.option:disabled { cursor: default; }
.option.chosen { box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.4); }
.option.fit-good { border-color: var(--ok); background: var(--ok-bg); }
.option.fit-cond { border-color: var(--warn); background: var(--warn-bg); }
.option.fit-poor { border-color: var(--ng); background: var(--ng-bg); }
.fit-tag { font-weight: 800; white-space: nowrap; font-size: 0.88rem; }
.fit { font-weight: 800; }
.fit-good { color: #bbf7d0; } .fit-cond { color: #fde68a; } .fit-poor { color: #fecdd3; }
.option.fit-good .fit-tag { color: #bbf7d0; } .option.fit-cond .fit-tag { color: #fde68a; } .option.fit-poor .fit-tag { color: #fecdd3; }
.review { padding-left: 1.3em; } .review li { margin: 10px 0; }
.axis { display: grid; grid-template-columns: 8em 1fr 3em; gap: 10px; align-items: center; }
.grade { display: inline-flex; align-items: center; gap: 10px; background: var(--card2); border: 2px solid var(--cyan); border-radius: 14px; padding: 4px 18px; margin: 8px 0; }
.grade-letter { font-size: 2.6rem; font-weight: 900; color: var(--cyan); line-height: 1.2; }
.mail { border: 1px solid var(--line); border-radius: 12px; background: #f3f7ff; color: #0b1730; overflow: hidden; margin: 10px 0; }
.mail .muted { color: #46557a; }
.mail-head { background: #dbe6fb; padding: 10px 14px; border-bottom: 1px solid #b9c9ea; }
.mail-body { padding: 10px 16px; }
.fakelink { color: #1d4ed8; text-decoration: underline; }
.linkreal { display: inline-block; background: #fff4c2; border: 1px solid #d4a800; color: #3b2f00; padding: 0 8px; border-radius: 6px; word-break: break-all; }
.mail .btn.ghost { color: #0b1730; border-color: #7b8db5; }

/* クリア画面・ダッシュボード */
.clear { text-align: center; }
.clear-shield { font-size: 3.2rem; }
.clear-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
.clear-stats > div { background: var(--card2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; }
.xp-big { font-size: 2.2rem; color: var(--cyan); line-height: 1.2; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.dash-grid .card { margin: 0; }
.big-num { font-size: 2.2rem; color: var(--cyan); }
.stage-prog { list-style: none; padding: 0; }
.stage-prog li { display: grid; grid-template-columns: 1fr; gap: 2px; margin-bottom: 10px; }
.ach { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.ach li { display: flex; gap: 10px; align-items: flex-start; background: var(--card2); border-radius: 10px; padding: 8px 12px; }
.ach li.off { opacity: 0.65; }
.ach li span { font-size: 1.5rem; }
.switch { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--cyan); margin-top: 4px; flex: none; }
.trial-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; position: sticky; top: 96px; z-index: 5; }
.timer { font-size: 1.3rem; font-weight: 800; color: var(--cyan); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--ng); }
input[type="text"], select, textarea { width: 100%; font: inherit; color: var(--text); background: #07173a; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-top: 4px; }
label { display: block; }
label.choice, label.switch { display: flex; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row label { flex: 1; min-width: 14em; }
table.rank th, table.rank td { white-space: nowrap; }
.share-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
.cardcanvas { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; }
textarea { resize: vertical; }

/* トースト・XP演出（控えめ） */
.toasts { position: fixed; right: 12px; bottom: 12px; display: grid; gap: 8px; z-index: 50; max-width: min(92vw, 340px); }
.toast { background: var(--card2); border: 2px solid var(--cyan); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); animation: slidein 0.35s ease; }
.xpfx { position: fixed; left: 50%; top: 28%; transform: translateX(-50%); z-index: 40; pointer-events: none; }
.xpfloat { color: var(--cyan); font-weight: 900; font-size: 2rem; text-shadow: 0 2px 10px #000; animation: floatup 1.5s ease-out forwards; }
@keyframes slidein { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes floatup { from { transform: translateY(14px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-44px); opacity: 0; } }

@media (max-width: 760px) {
  body { font-size: 16px; }

    single('b7', 'vulnBasic', 'normal', '「脆弱性が存在すること」と「攻撃が成功したこと」の関係として正しいものはどれ？', ['脆弱性があっても、攻撃が成功したとは限らない（別々に確認が必要）', '脆弱性があれば、必ず攻撃は成功している', '攻撃が試みられたなら、必ず成功している', '修正版を公開した時点で、すべてのサイトの安全が確定する'], 0, '「ある」「試された」「成功した」「被害が出た」は別の段階です。ニュースを読むときも、どの段階の話かを分けて確認しましょう。'),
    // ───────── 今回の脆弱性に関する事実 ─────────
    single('f1', 'vulnFact', 'normal', 'CVE-2026-109618について、公開情報が説明している原因の概要として最も適切なものはどれ？', ['メモリ不足時の処理の途中終了で状態が不整合になり、後片付けでメモリが壊れる問題', '各サイトのSQL文の組み立て方が間違っている問題', 'パスワードが弱いことによる不正ログイン', 'PHPの文法そのものが危険な設計であること'], 0, '公開情報（Rapid7・Red Hat等）は、PHP本体のメモリ不足時の処理に不備があると説明しています。アプリのコードの書き方の問題ではありません。', { factIds: ['ids', 'cause'], volatile: true }),
    single('f2', 'vulnFact', 'normal', 'CVE-2026-109619について、公開情報が説明している原因の概要として最も適切なものはどれ？', ['リクエスト間で残った古い状態が解放済みメモリを指し、後続のリクエストで使われる問題', '画像の圧縮形式の問題', 'メール送信機能の宛先の確認漏れ', 'ブラウザの拡張機能の脆弱性'], 0, '使い回されるワーカーに前のリクエストの状態が残り、解放済みメモリを後続の処理が参照する「解放後使用」型の問題と説明されています。', { factIds: ['ids'], volatile: true }),
    single('f3', 'vulnFact', 'normal', 'PHP 8.4系で、この問題が修正された最初のバージョンはどれ？（2026-10-23時点の公表情報）', ['8.4.27', '8.4.1', '8.4.26', '8.3.36'], 0, '8.2系は8.2.35、8.3系は8.3.36、8.4系は8.4.27、8.5系は8.5.12で修正されました。公式情報が更新される可能性があるため、実際の対応時は必ず最新の公式情報を確認してください。', { factIds: ['versions'], volatile: true }),
    single('f4', 'vulnFact', 'normal', 'PHP 8.1以前について、公表情報から言えることはどれ？', ['通常の修正版は提供されず、7.4・8.0・8.1には最小限の緩和策のみ。サポート中の版への移行が推奨される', '8.1以前にも、同じ形で修正版が提供された', '8.1以前は、この問題の影響を一切受けない', '8.1以前は、自動的に最新版へ更新される'], 0, 'JPCERT/CC注意喚起による整理です。サポート終了版を使い続ける環境は、特に早い対応が必要です。', { factIds: ['versions'], volatile: true }),
    single('f5', 'vulnFact', 'normal', '今回の問題の原因として、公開情報にもっとも近いものはどれ？', ['PHP本体（処理系）の実装上の不備で、PHP本体の更新で対処する', 'PHPを使うすべてのサイトの開発者が、安全でないコードを書いたこと', 'PHPという言語を使うこと自体が禁止されたこと', 'ユーザーが弱いパスワードを使っていたこと'], 0, 'PHPという言語の設計論や、各アプリの実装ミスと混同しないことが大切です。今回は「処理系の不備」で、サイト運営者はPHP本体（または提供元のパッケージ）の更新が必要になります。', { factIds: ['cause'] }),
    single('f6', 'vulnFact', 'hard', '「PHP Groupが修正版を公開した」ことの意味として適切なものはどれ？', ['修正版が用意されただけで、各環境での更新・再起動が終わるまで、各サイトは安全とは限らない', '世界中のすべてのサイトが自動的に安全になった', '以後、PHPに脆弱性は見つからなくなった', '修正版を入れなくても、設定変更だけで完全に防げる'], 0, '公開と適用は別です。ホスティング会社・OSのパッケージ提供元・自社運用など、各所で更新が行われる必要があります。', { factIds: ['rollout', 'mitigation'] }),
    multi('f7', 'vulnFact', 'normal', 'JPCERT/CC注意喚起が確認を求めている「攻撃の痕跡」をすべて選んでください。', ['異常に長い、または異常な形式のPHPSESSID Cookie', '不審なmultipart/form-dataリクエスト', 'PHPワーカーの予期せぬ異常終了や頻繁な再起動', 'サイトのアクセス数が増えたので、すぐに安全と判断できる', 'ブラウザの背景色が変わった'], [0, 1, 2], '見るべきは、異常なCookie・不審なリクエスト・メモリ関連エラーやHTTP 500・ワーカーの異常終了などです。痕跡がなくても攻撃を受けていないとは断定できません。', { factIds: ['afterpatch'] }),
    single('f8', 'vulnFact', 'hard', '「攻撃は観測されたか」についての説明として、最も適切なものはどれ？', ['民間事業者から試行・悪用の観測報告がある一方、観測していない主体もあり、被害の全体像は未確認', '公式に、被害はゼロと確認された', '日本国内のすべてのサイトが侵害されたと確認された', '攻撃はまったく試みられていない'], 0, '観測主体・時点によって記載が異なります。「試行があった」ことと「成功した」ことは別で、実被害の全体像は未確認です。断定せずに、出典と時点を添えて伝えましょう。', { factIds: ['exploit', 'damage'], volatile: true }),
    single('f9', 'vulnFact', 'hard', '「暫定措置（設定変更など）」についての説明として適切なものはどれ？', ['特定の攻撃経路を減らすだけで、修正版への更新の代わりにはならない', '設定変更だけで完全に問題が解決する', '暫定措置は、何もしないよりも悪い', '暫定措置を入れたら、更新は永久に不要になる'], 0, 'JPCERT/CC注意喚起でも、緩和策は特定の攻撃経路にのみ対処するもので根本的な解決にはならないとされています。暫定措置は時間稼ぎで、更新の計画とセットで考えます。', { factIds: ['mitigation'] }),
    single('f10', 'vulnFact', 'normal', '多くの組織がサービスを一時停止した理由として、公開情報から言えることはどれ？', ['予防的措置として停止・緊急メンテナンスを行った例が報じられている（個別の理由は各組織の発表を確認する）', '全組織が、実際に侵害されたことを認めたから', '法律で停止が義務付けられたから', '停止した組織は、すべて同じ理由で停止した'], 0, '「停止＝侵害された」ではありません。更新・点検が済むまで入口を閉じる予防的措置の例が多いと報じられていますが、理由は組織ごとに確認が必要です。', { factIds: ['suspend'], volatile: true }),
    single('f11', 'vulnFact', 'hard', 'Rapid7の説明で、最もリスクが高いとされた実行方式はどれ？', ['Apacheのmod_php', 'どの方式でも同じで、差はない', 'PHP-FPMのみ', 'ブラウザ上のJavaScript'], 0, 'Rapid7はmod_phpが最も高リスクで、PHP-FPMには追加の前提条件があると説明しています。ただしFPMでも更新は必要です。', { factIds: ['runtime'], volatile: true }),
    single('f12', 'vulnFact', 'normal', '公表前日までにIPAが呼びかけた「事前準備」として適切なものはどれ？', ['PHPを利用している自組織のシステムの棚卸しと、修正版をすぐ適用できる準備', '公表されるまでサイトをすべて閉鎖する', 'PHPを使うことをやめる', '何もせずSNSで様子を見る'], 0, 'IPAの事前告知は、PHP利用の棚卸し（＝自分たちが使っているシステムやソフトを洗い出して一覧にし、どこでPHPが使われ、どのバージョンかを把握すること）・製品の提供元情報の確認・修正版適用の準備を求めていました。製品の内部にPHPが使われていて把握しづらい場合がある点も注意されています。', { factIds: ['event'] }),
    single('f13', 'vulnFact', 'easy', '8.3系で「影響を受ける」とされたのは、どのバージョン？', ['8.3.36より前', '8.3.36以降すべて', '8.3系は影響なし', '8.3.1だけ'], 0, '8.3系は8.3.36未満が影響を受け、8.3.36で修正されています。「〇〇未満」の読み方に注意しましょう。', { factIds: ['versions'], volatile: true }),
    single('f14', 'vulnFact', 'normal', '「悪用された場合に起こり得ること」（想定）として、JPCERT/CC注意喚起が示している内容はどれ？', ['PHPの実行プロセスの権限で、任意のコードを実行される可能性', '利用者のパスワードが自動的に公開される（確認済みの事実）', '日本中のすべてのサイトが停止する（確認済みの事実）', 'ブラウザが壊れる'], 0, '「起こり得る（想定）」と「実際に起きた被害」は区別します。実被害の規模は未確認です。', { factIds: ['impact', 'damage'] }),
    single('f15', 'vulnFact', 'hard', '修正版が出たときの「最優先の対応」として最も適切なものはどれ？', ['自組織でPHPを使っている場所（バージョン・実行方式）を把握し、修正版へ更新する。更新できない間は暫定措置と監視を行う', 'まず原因が判明するまで何もしない', '被害報告が出るまで更新を遅らせる', 'ネットで見つけた攻撃コードで自分のサイトを試す'], 0, '把握（棚卸し）→更新（または提供元の修正版）→確認、が基本線です。自分のサイトでも、許可のない攻撃コードの実行は行いません。', { factIds: ['mitigation'] }),
    // ───────── 安全なコードの考え方 ─────────
    code('c1', 'secureCode', 'normal', '入力値の検証不足：架空の通販サイトの注文処理です。問題の起点となる行を選び、安全な修正を選んでください。', ['$qty   = $_POST[\'quantity\'];', '$price = 1200;', '$total = $price * $qty;', 'saveOrder($userId, $total);'], 0, ['整数かつ範囲内（例：1〜10）かをサーバー側で検証し、不正なら400で処理を止める', '前後の空白を取り除くだけにする', 'ブラウザ側（JavaScript）の入力チェックだけにする'], 0, '入力はサーバー側で「型・範囲・形式」を検証します。ブラウザ側のチェックは利便性のためのもので、迂回できるため防御にはなりません。マイナスの数量や文字列のまま計算すると、金額の不正や障害の原因になります。'),
    code('c2', 'secureCode', 'normal', 'SQLインジェクション：商品検索の処理です。問題の行を選び、安全な修正を選んでください。', ['$id  = $_GET[\'id\'];', '$sql = "SELECT * FROM items WHERE id = " . $id;', '$rows = $db->query($sql);', 'render($rows);'], 1, ['プレースホルダ（パラメータ化クエリ）を使い、値をSQLとは別に渡す', 'エラーメッセージを画面に表示しないようにする', '入力文字列からスペースを取り除く'], 0, '利用者の入力をSQL文字列に連結すると、入力がSQLの一部として解釈される危険があります。値は「プレースホルダ」で別に渡すのが基本です。エラー非表示は対処にならず、部分的な文字除去も確実ではありません。'),
    code('c3', 'secureCode', 'normal', 'クロスサイトスクリプティング（XSS）：コメント表示の処理です。問題の行を選び、安全な修正を選んでください。', ['$comment = $_POST[\'comment\'];', 'saveComment($comment);', 'echo "<p>" . $comment . "</p>";', '// 保存は完了'], 2, ['表示するときに htmlspecialchars で出力先に合わせてエスケープする', '保存する前に「<」の文字を全部消す', 'コメントの文字数を制限するだけにする'], 0, '入力された文字列をそのままHTMLに出すと、ブラウザがスクリプトとして解釈する危険があります。対策は「出力時に、出力先に合わせてエスケープ」することが基本です。'),
    code('c4', 'secureCode', 'hard', 'アクセス制御の不備：注文詳細ページの処理です。問題の行を選び、安全な修正を選んでください。', ['$orderId = $_GET[\'order\'];', '$order   = findOrder($orderId);', '// ログインしているかだけを確認', 'if ($isLoggedIn) { showOrder($order); }'], 3, ['ログイン確認に加え、その注文が本人のものか（所有者）をサーバー側で確認し、違えば403にする', '注文番号を長くて推測しにくい文字列にするだけにする', 'ログイン画面のデザインを強化する'], 0, '「誰か（認証）」の確認だけでは、「その人にそのデータを見る権限があるか（認可）」が確認できていません。推測しにくいIDは補助にはなりますが、認可チェックの代わりにはなりません。'),
    code('c5', 'secureCode', 'hard', '安全でないファイル処理：プロフィール画像のアップロード処理です。問題の行を選び、安全な修正を選んでください。', ['$tmp  = $_FILES[\'photo\'][\'tmp_name\'];', '$name = $_FILES[\'photo\'][\'name\'];', '$dest = "/var/www/html/uploads/" . $name;', 'move_uploaded_file($tmp, $dest);'], 2, ['許可する形式を限定して検証し、ファイル名はサーバー側で生成、保存先はWeb公開されない場所にする', '拡張子が「.php」のときだけ拒否する', 'ファイル名の長さを制限するだけにする'], 0, '利用者が付けたファイル名で、Webから実行・参照できる場所に保存すると危険です。許可リストでの形式検証、サーバー生成のファイル名、公開されない保存先、が基本です。一部の拡張子だけを拒否する方式は抜けが出やすいです。'),
    single('s1', 'secureCode', 'normal', '「認証」と「認可」の違いとして正しいものはどれ？', ['認証は「あなたは誰か」の確認、認可は「その操作・データを許可されているか」の確認', '認証と認可は同じ意味', '認証は管理者だけが行う', '認可はログイン前に必ず終わっている'], 0, 'ログインできること（認証）と、他人のデータを見られないこと（認可）は別の話です。'),
    single('s2', 'secureCode', 'normal', '「最小権限の原則」の説明として最も適切なものはどれ？', ['プログラムや利用者には、仕事に必要な最小限の権限だけを与える', 'すべてのプログラムに管理者権限を与える', '権限は、一度与えたら見直さない', 'パスワードは最小の文字数にする'], 0, '万一乗っ取られたときの被害範囲を小さくできます。今回のように「PHPの実行プロセスの権限で」コードが動かされ得る場合も、そのプロセスの権限が小さいほど影響を抑えやすくなります。'),
    single('s3', 'secureCode', 'normal', 'ログと監視の役割として、最も適切なものはどれ？', ['異常に気づく・原因を調べる・影響範囲を確定するための手がかりを残す', '画面を派手にする', 'ログは何も役に立たない', 'ログは攻撃を完全に防ぐ'], 0, 'ログは防御そのものではありませんが、早期発見と事後調査に不可欠です。ログがない=攻撃がなかった、とは言えません。'),
    single('s4', 'secureCode', 'normal', '入力値のチェックを「ブラウザ側のJavaScriptだけ」で行うことの問題点は？', ['攻撃者はブラウザを経由せずリクエストを直接作れるため、サーバー側でも検証が必要', '問題はない', 'JavaScriptは使えないため', 'サーバー側は検証をしてはいけないため'], 0, 'ブラウザ側のチェックは親切のためで、安全のための最終防衛線はサーバー側の検証です。'),
    single('s5', 'secureCode', 'hard', '今回のPHPの脆弱性と、SQLインジェクションやXSSの関係として正しいものはどれ？', ['別の種類の問題。今回はPHP本体の更新が必要で、SQLインジェクションやXSSはアプリのコードで防ぐ', '同じ原因の問題で、同じ方法で防げる', '今回の脆弱性が、SQLインジェクションとXSSを引き起こした', 'SQLインジェクションやXSSは、PHPを更新すれば必ず消える'], 0, 'どちらも大切ですが、別々の対策が必要です。今回の問題を「すべてのWeb攻撃の原因」のように捉えないようにしましょう。', { factIds: ['cause'] }),
    multi('s6', 'secureCode', 'normal', '安全な処理の例を、すべて選んでください。', ['SQLにはプレースホルダで値を渡す', 'HTMLに出力するときはエスケープする', '入力値をそのままSQL文字列に連結する', 'パスワードやAPIキーをソースコードに直接書いて公開リポジトリに置く'], [0, 1], '連結や秘密情報の直書きは典型的な危険例です。秘密情報は環境変数や専用の仕組みで管理し、リポジトリに含めません。'),
    // ───────── パッチ適用と緊急対応 ─────────
    single('pa1', 'patch', 'easy', 'セキュリティパッチ（修正プログラム）とは？', ['脆弱性を修正するための更新', '画面のデザインを変える更新', 'ゲームのレベルを上げる機能', '広告を表示するプログラム'], 0, 'セキュリティパッチは、見つかった脆弱性をふさぐための更新です。'),
    order('pa2', 'patch', 'normal', '更新作業の流れとして適切な順に並べてください。', ['影響範囲を確認する（使用中のバージョン・実行方式）', 'バックアップを取り、戻し方を決める', 'テスト環境で更新して動作を検証する', '本番環境に適用する', '動作確認と、ログの監視を行う'], '「確認 → 備える → 試す → 適用 → 確認・監視」。緊急時でも、バックアップと動作確認を飛ばすと、別の障害を招く恐れがあります。'),
    single('pa3', 'patch', 'normal', '更新の前に確認しておくべきこととして、最も適切なものはどれ？', ['現在のバージョン、実行方式、依存するソフトとの互換性、戻し手順', '更新対象のソフトの名前だけ', 'SNSの反応の数', '利用者の年齢'], 0, '互換性や戻し手順を確認しておかないと、更新による障害が起きたときに復旧できなくなります。'),
